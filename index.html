<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#11131f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>フック引っ掛けクレーン練習シミュレーター</title>
  <script type="module" crossorigin src="./assets/index-I_Jfz4Q0.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BKXjRZDH.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <select id="preset" aria-label="プリセット"></select>
      <button id="modeBtn">実機</button>
      <button id="demoBtn">デモ</button>
      <button id="advisorBtn" class="adv-btn">攻略</button>
      <button id="camBtn">正面</button>
      <button id="peekLockBtn" title="覗き込み視点を固定">覗き</button>
      <button id="slowBtn">1x</button>
      <button id="guideBtn">ガイド</button>
      <button id="menuBtn" aria-label="設定">⚙</button>
    </header>
    <div id="stage">
      <div id="playCounter"></div>
      <div id="hud"></div>
      <div id="peekBadge"></div>
      <div id="answerBox"></div>
      <div id="msg"></div>
      <div id="hint"></div>
    </div>
    <div id="controls">
      <div id="realCtl" class="ctl">
        <button id="btn1" class="big">①<small>横 →</small></button>
        <button id="btn2" class="big">②<small>奥 ↑</small></button>
      </div>
      <div id="freeCtl" class="ctl">
        <div class="dpad">
          <button data-k="u" class="d u">▲</button>
          <button data-k="l" class="d l">◀</button>
          <button data-k="r" class="d r">▶</button>
          <button data-k="d" class="d dn">▼</button>
        </div>
        <button id="dropBtn" class="big drop">降下</button>
      </div>
      <div class="sub-btns">
        <button id="resetBtn" class="sub-btn">初期位置</button>
        <button id="resetStatsBtn" class="sub-btn">集計リセット</button>
      </div>
    </div>
    <aside id="panel">
      <div class="phead"><b>台設定</b><button id="closePanel">✕</button></div>
      <div id="presetDesc"></div>
      <div id="fields"></div>
      <div class="row">
        <button id="randBtn">ランダム生成</button>
        <button id="shareBtn">共有URLコピー</button>
      </div>
      <h4>マイ設定</h4>
      <div class="row">
        <select id="savedSel"></select>
        <button id="loadBtn">読込</button>
        <button id="delBtn">削除</button>
      </div>
      <div class="row"><button id="saveBtn">現在の設定を保存</button></div>
      <h4>統計</h4>
      <div id="stats"></div>
      <div class="row"><button id="clearStats">統計リセット</button></div>
    </aside>
    <section id="advisorModal" aria-label="現場攻略チェックリスト"></section>
  </div>
</body>
</html>
